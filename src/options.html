<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>API.SH settings</title><style>body{width:auto;max-width:560px;margin:40px auto}</style></head>
<body>
<header><img src="../icons/icon32.png" alt=""><b>API.SH</b><span class="mono muted small">settings</span></header>
<main>
  <label for="key">API key</label><input id="key" type="password" placeholder="ash_live_…" autocomplete="off">
  <p class="small muted">Your key is stored in Chrome sync storage and only sent to api.api.sh. Create or revoke keys in your dashboard at <a href="https://app.api.sh/keys" target="_blank" style="color:var(--y)">api.sh</a>.</p>
  <div class="row"><button id="save">Save</button><button id="test" class="ghost">Test key</button><span id="msg" class="small"></span></div>
</main>
<script src="options.js" type="module"></script>
</body></html>
